<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Mục Sản Phẩm - World of Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html"><i class="bi bi-arrow-left-short"></i> World of Books</a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row">
            <div class="col-lg-3 col-12 mb-4">
                <div class="card border-0 shadow-sm p-3 sticky-top" style="top: 80px;">
                    <h5 class="fw-bold text-secondary mb-3"><i class="bi bi-filter-square me-2"></i>Bộ Lọc Tìm Kiếm</h5>
                    <hr class="mt-0">
                    
                    <h6 class="fw-bold mb-2">Theo Khoảng Giá</h6>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="priceRange1">
                        <label class="form-check-label" for="priceRange1">Dưới 100.000đ</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="priceRange2">
                        <label class="form-check-label" for="priceRange2">Từ 100.000đ - 200.000đ</label>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="priceRange3">
                        <label class="form-check-label" for="priceRange3">Trên 200.000đ</label>
                    </div>

                    <h6 class="fw-bold mb-2">Hình Thức Bìa</h6>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="cover1">
                        <label class="form-check-label" for="cover1">Bìa Mềm</label>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="cover2">
                        <label class="form-check-label" for="cover2">Bìa Cứng (Premium)</label>
                    </div>

                    <button class="btn btn-primary btn-sm w-100 fw-bold py-2">Áp Dụng Lọc Khay</button>
                </div>
            </div>

            <div class="col-lg-9 col-12">
                <div class="card border-0 shadow-sm p-3 mb-4 d-flex flex-sm-row justify-content-between align-items-sm-center gap-2">
                    <h5 class="fw-bold text-dark mb-0">Kết quả hiển thị sách</h5>
                    <select class="form-select form-select-sm w-auto">
                        <option>Sắp xếp: Mới Nhất</option>
                        <option>Giá tăng dần</option>
                        <option>Giá giảm dần</option>
                    </select>
                </div>

                <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
                    <div class="col">
                        <div class="card h-100 border-0 shadow-sm text-center p-2">
                            <img src="../images/nhagiakim.jpg" class="card-img-top mx-auto" style="max-height: 180px; width:auto;" alt="Nhà Giả Kim">
                            <div class="card-body d-flex flex-column justify-content-between">
                                <h6 class="fw-bold text-dark mb-1">Nhà Giả Kim</h6>
                                <p class="text-danger fw-bold mb-3">79.000đ</p>
                                <a href="chitiet.html" class="btn btn-primary btn-sm w-100 fw-bold">Xem Chi Tiết</a>
                            </div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="card h-100 border-0 shadow-sm text-center p-2">
                            <img src="../images/dacnhantam.jpg" class="card-img-top mx-auto" style="max-height: 180px; width:auto;" alt="Đắc Nhân Tâm">
                            <div class="card-body d-flex flex-column justify-content-between">
                                <h6 class="fw-bold text-dark mb-1">Đắc Nhân Tâm</h6>
                                <p class="text-danger fw-bold mb-3">86.000đ</p>
                                <a href="chitiet.html" class="btn btn-primary btn-sm w-100 fw-bold">Xem Chi Tiết</a>
                            </div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="card h-100 border-0 shadow-sm text-center p-2">
                            <img src="../images/tuoitredanggiabaonhieu.jpg" class="card-img-top mx-auto" style="max-height: 180px; width:auto;" alt="Tuổi Trẻ">
                            <div class="card-body d-flex flex-column justify-content-between">
                                <h6 class="fw-bold text-dark mb-1">Tuổi Trẻ Đáng Giá Bao Nhiêu</h6>
                                <p class="text-danger fw-bold mb-3">75.000đ</p>
                                <a href="chitiet.html" class="btn btn-primary btn-sm w-100 fw-bold">Xem Chi Tiết</a>
                            </div>
                        </div>
                    </div>
                </div>

                <nav class="mt-5">
                    <ul class="pagination justify-content-center">
                        <li class="page-item disabled"><a class="page-link" href="#">Trước</a></li>
                        <li class="page-item active"><a class="page-link" href="#">1</a></li>
                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                        <li class="page-item"><a class="page-link" href="#">Tiếp</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
