<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cập Nhật Tài Khoản - Sách Không Ngủ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container"><a class="navbar-brand fw-bold" href="../index.html">Sách Không Ngủ</a></div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card border-0 shadow-sm p-4 bg-white">
                    <h4 class="fw-bold text-center text-primary mb-4">CẬP NHẬT HỒ SƠ SINH VIÊN</h4>
                    
                    <form class="needs-validation" novalidate>
                        <div class="row g-3">
                            <div class="col-sm-6">
                                <label for="firstName" class="form-label fw-bold">Họ và chữ lót</label>
                                <input type="text" class="form-control" id="firstName" value="Phạm Văn" required>
                                <div class="invalid-feedback">Không được để trống phần Họ.</div>
                            </div>
                            <div class="col-sm-6">
                                <label for="lastName" class="form-label fw-bold">Tên học viên</label>
                                <input type="text" class="form-control" id="lastName" value="Khôi" required>
                                <div class="invalid-feedback">Không được để trống tên.</div>
                            </div>
                            <div class="col-12">
                                <label for="email" class="form-label fw-bold">Địa chỉ Email</label>
                                <input type="email" class="form-control" id="email" value="khoi.cntt@example.com" required>
                                <div class="invalid-feedback">Vui lòng nhập cấu trúc Email hợp lệ.</div>
                            </div>
                            <div class="col-md-6">
                                <label for="province" class="form-label fw-bold">Tỉnh / Thành phố</label>
                                <select class="form-select" id="province" required>
                                    <option value="">Chọn...</option>
                                    <option selected>Cần Thơ</option>
                                    <option>TP. Hồ Chí Minh</option>
                                    <option>Hà Nội</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="mssv" class="form-label fw-bold">Mã Số Sinh Viên (MSSV)</label>
                                <input type="text" class="form-control" id="mssv" value="CNTT2411070" readonly>
                            </div>
                        </div>

                        <hr class="my-4">
                        <button class="btn btn-primary w-100 py-2 fw-bold" type="submit">Lưu Cập Nhật Hồ Sơ</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        (() => {
          'use strict'
          const forms = document.querySelectorAll('.needs-validation')
          Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
              if (!form.checkValidity()) {
                event.preventDefault()
                event.stopPropagation()
              }
              form.classList.add('was-validated')
            }, false)
          })
        })()
    </script>
</body>
</html>
